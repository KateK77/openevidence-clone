openapi: 3.0.3
info:
  title: MedEvidence AI API
  version: 2.0.0
paths:
  /api/answers/{id}/:
    get:
      operationId: answers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - answers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/answers/{id}/export/{kind}/:
    get:
      operationId: answers_export_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - answers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/answers/{id}/save/:
    put:
      operationId: answers_save_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - answers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: answers_save_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - answers
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/articles/:
    get:
      operationId: search_pubmed
      parameters:
      - in: query
        name: article_type
        schema:
          enum:
          - Clinical Trial
          - Randomized Controlled Trial
          - Review
          - Systematic Review
          - Meta-Analysis
          type: string
          minLength: 1
        description: |-
          * `Clinical Trial` - Clinical Trial
          * `Randomized Controlled Trial` - Randomized Controlled Trial
          * `Review` - Review
          * `Systematic Review` - Systematic Review
          * `Meta-Analysis` - Meta-Analysis
      - in: query
        name: free
        schema:
          type: boolean
      - in: query
        name: journal
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - in: query
        name: q
        schema:
          type: string
          maxLength: 400
          minLength: 1
        required: true
      - in: query
        name: sort
        schema:
          enum:
          - relevance
          - pub date
          type: string
          default: relevance
          minLength: 1
        description: |-
          * `relevance` - relevance
          * `pub date` - pub date
      - in: query
        name: year
        schema:
          type: integer
          maximum: 2100
          minimum: 1800
      tags:
      - articles
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
          description: ''
  /api/articles/{identifier}/:
    get:
      operationId: articles_retrieve
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
        required: true
      tags:
      - articles
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/articles/{identifier}/save/:
    put:
      operationId: articles_save_update
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
        required: true
      tags:
      - articles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Collection'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: articles_save_destroy
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
        required: true
      tags:
      - articles
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/ask/:
    post:
      operationId: ask_create
      tags:
      - ask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Question'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/conversations/:
    get:
      operationId: list_conversations
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
          description: ''
    delete:
      operationId: clear_history
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/conversations/{id}/:
    get:
      operationId: get_conversation
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: rename_conversation
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTitle'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: delete_conversation
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/login/:
    post:
      operationId: login_create
      tags:
      - login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/logout/:
    post:
      operationId: logout_create
      tags:
      - logout
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/profile/:
    get:
      operationId: profile_retrieve
      tags:
      - profile
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: profile_partial_update
      tags:
      - profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/register/:
    post:
      operationId: register_create
      tags:
      - register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/saved-answers/:
    get:
      operationId: saved_answers_retrieve
      tags:
      - saved-answers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
          description: ''
  /api/saved-articles/:
    get:
      operationId: saved_articles_retrieve
      tags:
      - saved-articles
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
          description: ''
  /api/saved-searches/:
    get:
      operationId: saved_searches_retrieve
      tags:
      - saved-searches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: saved_searches_create
      tags:
      - saved-searches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiteratureQuery'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/saved-searches/{id}/:
    delete:
      operationId: saved_searches_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - saved-searches
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/session/:
    get:
      operationId: session_retrieve
      tags:
      - session
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/settings/:
    get:
      operationId: settings_retrieve
      tags:
      - settings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          description: ''
    patch:
      operationId: settings_partial_update
      tags:
      - settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSettings'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          description: ''
components:
  schemas:
    ArticleTypeEnum:
      enum:
      - Clinical Trial
      - Randomized Controlled Trial
      - Review
      - Systematic Review
      - Meta-Analysis
      type: string
      description: |-
        * `Clinical Trial` - Clinical Trial
        * `Randomized Controlled Trial` - Randomized Controlled Trial
        * `Review` - Review
        * `Systematic Review` - Systematic Review
        * `Meta-Analysis` - Meta-Analysis
    Collection:
      type: object
      properties:
        collection:
          type: string
          default: ''
          maxLength: 80
    Credentials:
      type: object
      properties:
        username:
          type: string
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
      - username
    DetailEnum:
      enum:
      - Concise
      - Standard
      - Detailed
      type: string
      description: |-
        * `Concise` - Concise
        * `Standard` - Standard
        * `Detailed` - Detailed
    DisplayEnum:
      enum:
      - Comfortable
      - Compact
      type: string
      description: |-
        * `Comfortable` - Comfortable
        * `Compact` - Compact
    LanguageEnum:
      enum:
      - English
      - Chinese
      - Spanish
      - French
      type: string
      description: |-
        * `English` - English
        * `Chinese` - Chinese
        * `Spanish` - Spanish
        * `French` - French
    LiteratureQuery:
      type: object
      properties:
        q:
          type: string
          maxLength: 400
        year:
          type: integer
          maximum: 2100
          minimum: 1800
        journal:
          type: string
          maxLength: 100
        article_type:
          $ref: '#/components/schemas/ArticleTypeEnum'
        free:
          type: boolean
        sort:
          allOf:
          - $ref: '#/components/schemas/SortEnum'
          default: relevance
      required:
      - q
    PatchedProfile:
      type: object
      properties:
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    PatchedSettings:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/LanguageEnum'
        detail:
          $ref: '#/components/schemas/DetailEnum'
        display:
          $ref: '#/components/schemas/DisplayEnum'
    PatchedTitle:
      type: object
      properties:
        title:
          type: string
          maxLength: 180
    Profile:
      type: object
      properties:
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - username
    Question:
      type: object
      properties:
        question:
          type: string
          maxLength: 2000
          minLength: 1
        conversation:
          type: integer
          minimum: 1
      required:
      - question
    Settings:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/LanguageEnum'
        detail:
          $ref: '#/components/schemas/DetailEnum'
        display:
          $ref: '#/components/schemas/DisplayEnum'
      required:
      - detail
      - display
      - language
    SortEnum:
      enum:
      - relevance
      - pub date
      type: string
      description: |-
        * `relevance` - relevance
        * `pub date` - pub date
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: medevidence_session_v2
